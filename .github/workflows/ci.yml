name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tokenos
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: tokenos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokenos -d tokenos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TOKENOS_TEST_DATABASE_URL: postgresql://tokenos:ci-disposable-password@localhost:5432/tokenos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.11
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: uv run pytest -q --junitxml=tests.xml
      - run: docker build -t tokenos:test .
